[project]
name = "social-ai-saas-api"
version = "1.0.0"
description = "AI Social Media Analytics & Content SaaS — Flask API"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "worker"]

[tool.black]
line-length = 100
target-version = ["py312"]
